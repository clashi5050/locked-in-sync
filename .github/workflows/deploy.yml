# End-to-end deploy: provisions/updates Azure infra with Terraform, then ships
# the Function App (api/) and the static dashboard (WebApp/) on top of it.
# See WebApp/DEPLOY.md for the one-time setup this workflow assumes.
name: Deploy Lock In

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

# Serialize runs so two pushes never run `terraform apply` against the same
# state at once. Queue rather than cancel — killing an apply mid-flight can
# leave infra in a half-applied state.
concurrency:
  group: deploy-lockin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    outputs:
      resource_group: ${{ steps.tf-outputs.outputs.resource_group }}
      function_app_name: ${{ steps.tf-outputs.outputs.function_app_name }}
      static_web_app_name: ${{ steps.tf-outputs.outputs.static_web_app_name }}
    env:
      # The backend "azurerm" block authenticates separately from the
      # provider block and can't see TF_VAR_* (backends can't reference
      # input variables at all) — it needs these plain ARM_* names directly.
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_arm_client_id: ${{ secrets.ARM_CLIENT_ID }}
      TF_VAR_arm_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_arm_tenant_id: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_app_shared_secret: ${{ secrets.APP_SHARED_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      # backend.hcl isn't committed (it holds the tfstate storage account name);
      # generate it here from a repo/environment variable instead.
      - name: Write backend config
        env:
          TFSTATE_SA: ${{ vars.TFSTATE_SA }}
        run: |
          SA=$(echo "$TFSTATE_SA" | xargs)
          cat > backend.hcl <<EOF
          resource_group_name  = "rg-tfstate"
          storage_account_name = "$SA"
          container_name       = "tfstate"
          key                  = "lockin/dev.terraform.tfstate"
          EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Read outputs
        id: tf-outputs
        run: |
          echo "resource_group=$(terraform output -raw resource_group)" >> "$GITHUB_OUTPUT"
          echo "function_app_name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$(terraform output -raw static_web_app_name)" >> "$GITHUB_OUTPUT"

  deploy-api:
    name: Deploy API
    needs: terraform
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev
        working-directory: api

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.terraform.outputs.function_app_name }}
          package: api

  deploy-web:
    name: Deploy Web
    needs: terraform
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      # Static Web Apps deployment is keyed off a per-resource token, not OIDC,
      # so pull it from the resource Terraform just created.
      - name: Get deployment token
        id: swa-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name ${{ needs.terraform.outputs.static_web_app_name }} \
            --resource-group ${{ needs.terraform.outputs.resource_group }} \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: WebApp
          output_location: ""
          skip_app_build: true
